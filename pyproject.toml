# Ruff configuration — lint scope for the Universal Valuation Engine.
#
# Product code (packages + entry points + tests) is lint-clean under the ruff
# default rule set (E4/E7/E9 + F). Throwaway development/debug scripts live at
# the repo root with a `_` prefix (and classification/_*.py); they are excluded
# because their E402 hits are intentional `sys.path` bootstrap code that must
# run before imports.

[tool.ruff]
target-version = "py312"
extend-exclude = ["_*.py", "**/_*.py", "verify_bot.py"]

[tool.ruff.lint.per-file-ignores]
# E402: these modules deliberately mutate sys.path / env before importing the
# local packages, so a top-of-file import is not possible.
"main.py" = ["E402"]
"tests/conftest.py" = ["E402"]
